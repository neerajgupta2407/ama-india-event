# The website: API rules plus the static export (installed as /etc/nginx/snippets/amai-locations.conf).
include snippets/amai-proxy.conf;

root /opt/amai_web/out;

location /_next/static/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# Pages and other files: always revalidate (cheap 304s via ETag). Deploys delete old script files, so a
# browser must never keep an old page that points at them.
location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}

# Images rarely change.
location /img/ {
    expires 1h;
}

error_page 404 /404.html;
