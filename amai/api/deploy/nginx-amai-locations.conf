# The website: API rules plus the static export (installed as /etc/nginx/snippets/amai-locations.conf).
include snippets/amai-proxy.conf;

root /opt/amai_web/out;

location /_next/static/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location / {
    try_files $uri $uri/ =404;
}

error_page 404 /404.html;
