# AMAI staging. Only these Host values match, so the other sites on this server are untouched.
# The certificate "amai-events" was issued by certbot (certbot.timer renews it).
#   events.amaindiaevents.org  the website, plus /api on the same origin
#   api.amaindiaevents.org     the API only
#   43.242.224.132             plain HTTP, the website and API, for quick checks

# HTTPS: the website.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name events.amaindiaevents.org;

    ssl_certificate /etc/letsencrypt/live/amai-events/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amai-events/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/amai-locations.conf;
}

# HTTPS: the API only.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.amaindiaevents.org;

    ssl_certificate /etc/letsencrypt/live/amai-events/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amai-events/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/amai-proxy.conf;

    location = / {
        default_type application/json;
        return 200 '{"service":"amai-api","health":"/healthz/"}';
    }

    location / {
        return 404;
    }
}

# The domains redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name events.amaindiaevents.org api.amaindiaevents.org;
    return 301 https://$host$request_uri;
}

# Raw IP stays on plain HTTP for quick checks (no certificate can match an IP).
server {
    listen 80;
    listen [::]:80;
    server_name 43.242.224.132;

    include snippets/amai-locations.conf;
}
