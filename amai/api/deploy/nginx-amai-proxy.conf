# API rules, shared by every AMAI server block (installed as /etc/nginx/snippets/amai-proxy.conf).
client_max_body_size 1M;

# Django admin is not exposed over the public site.
location /admin/ {
    return 404;
}

location /static/ {
    alias /opt/amai_api/staticfiles/;
    expires 30d;
    access_log off;
}

location ~ ^/(api|healthz)/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_pass http://127.0.0.1:8210;
}
