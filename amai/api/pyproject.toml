[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '''
/(
  | \.venv
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_django = "django"
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_glob = ["*/migrations/*", ".venv/*"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901", "F403", "F405", "B904", "UP006", "UP007", "UP035"]
